name: Branch Name Check

on:
  workflow_call:

permissions: {}

jobs:
  branch-name:
    name: Check Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Validate Branch Prefix
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            main|development|staging) ;;
            feat/?*|feature/?*|fix/?*|bugfix/?*|chore/?*|hotfix/?*|release/?*|revert/?*|refactor/?*|docs/?*|test/?*|ci/?*|dependabot/?*) ;;
            *) printf 'Invalid branch name: %s. Use a prefix such as feat/, fix/, or docs/.\n' "$BRANCH_NAME" >&2; exit 1 ;;
          esac
